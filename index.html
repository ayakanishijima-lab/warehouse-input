<script>

const DB_NAME="warehouseInputDB";
const DB_VERSION=2;
const STORE="records";
const MASTER="master";
const CANCELS="cancels";


const KEYS=[
  "warehouse",
  "producer",
  "field",
  "cultivation",
  "variety",
  "size",
  "unit"
];


const DEFAULT={
  warehouse:[
    "倉庫1",
    "倉庫2",
    "倉庫3"
  ],
  producer:[],
  field:[],
  cultivation:[
    "有機",
    "特栽",
    "慣行"
  ],
  variety:[],
  size:[],
  unit:[
    "袋",
    "kg"
  ]
};


// Code.gsのWebアプリURL
const SYNC_URL=
"https://script.google.com/macros/s/AKfycbz2n6MXTa8GIjq0GTDk0UekZlXg2Bv09xUUvyRe9cuVHxydEF0HAS10We5gSBSg3ycd/exec";


// 現在修正中のローカルID
let editingId=null;


/* =========================
   IndexedDB
========================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const r=
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      r.onupgradeneeded=()=>{

        const d=r.result;


        if(
          !d.objectStoreNames.contains(
            STORE
          )
        ){

          d.createObjectStore(
            STORE,
            {
              keyPath:"id",
              autoIncrement:true
            }
          );

        }


        if(
          !d.objectStoreNames.contains(
            MASTER
          )
        ){

          d.createObjectStore(
            MASTER,
            {
              keyPath:"key"
            }
          );

        }


        if(
          !d.objectStoreNames.contains(
            CANCELS
          )
        ){

          d.createObjectStore(
            CANCELS,
            {
              keyPath:"id",
              autoIncrement:true
            }
          );

        }

      };


      r.onsuccess=()=>
        resolve(r.result);


      r.onerror=()=>
        reject(r.error);

    }
  );

}


async function put(
  store,
  obj
){

  const d=
    await openDB();


  return new Promise(
    (res,rej)=>{

      const t=
        d.transaction(
          store,
          "readwrite"
        );


      t.objectStore(
        store
      ).put(obj);


      t.oncomplete=res;


      t.onerror=()=>
        rej(t.error);

    }
  );

}


async function del(
  store,
  key
){

  const d=
    await openDB();


  return new Promise(
    (res,rej)=>{

      const t=
        d.transaction(
          store,
          "readwrite"
        );


      t.objectStore(
        store
      ).delete(key);


      t.oncomplete=res;


      t.onerror=()=>
        rej(t.error);

    }
  );

}


async function all(
  store
){

  const d=
    await openDB();


  return new Promise(
    (res,rej)=>{

      const r=
        d
        .transaction(
          store,
          "readonly"
        )
        .objectStore(store)
        .getAll();


      r.onsuccess=()=>
        res(r.result);


      r.onerror=()=>
        rej(r.error);

    }
  );

}


/* =========================
   共通
========================= */

function val(id){

  return document
    .getElementById(id)
    .value
    .trim();

}


function setv(id,v){

  document
    .getElementById(id)
    .value=
      v||"";

}


function msg(
  t,
  ok=true
){

  const e=
    document.getElementById(
      "message"
    );


  e.textContent=t;


  e.className=
    "message "+
    (
      ok
      ?"success"
      :"error"
    );


  setTimeout(
    ()=>{
      e.className="message";
    },
    3500
  );

}


function status(){

  const e=
    document.getElementById(
      "status"
    );


  e.className=
    "status "+
    (
      navigator.onLine
      ?"online"
      :"offline"
    );


  e.textContent=
    navigator.onLine
    ?"🟢 オンライン"
    :"🔴 オフライン（端末内に保存します）";

}


function fill(
  id,
  a
){

  const s=
    document.getElementById(id);


  s.innerHTML=
    '<option value="">選択してください</option>';


  [
    ...new Set(a||[])
  ]
  .filter(Boolean)
  .forEach(
    v=>{

      const o=
        document.createElement(
          "option"
        );


      o.value=v;
      o.textContent=v;


      s.appendChild(o);

    }
  );

}


function newId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }


  return Date.now().toString(36)+
    "-"+
    Math.random()
      .toString(36)
      .slice(2);

}


/* =========================
   マスタ
========================= */

async function loadMaster(){

  let a=
    await all(MASTER);


  if(!a.length){

    for(
      const k of KEYS
    ){

      await put(
        MASTER,
        {
          key:k,
          values:
            DEFAULT[k]||[]
        }
      );

    }


    a=
      await all(MASTER);

  }


  const m=
    Object.fromEntries(
      a.map(
        x=>[
          x.key,
          x.values
        ]
      )
    );


  KEYS.forEach(
    k=>
      fill(
        k,
        m[k]
      )
  );


  const last=
    JSON.parse(
      localStorage.getItem(
        "lastInput"
      )||"{}"
    );


  KEYS.forEach(
    k=>
      setv(
        k,
        last[k]
      )
  );

}


async function syncMaster(){

  if(!navigator.onLine){

    return msg(
      "現在オフラインです。電波が入ってからマスタを更新してください。",
      false
    );

  }


  if(
    SYNC_URL.startsWith("ここに")
  ){

    return msg(
      "SYNC_URLにCode.gsのWebアプリURLを設定してください。",
      false
    );

  }


  const b=
    document.getElementById(
      "masterButton"
    );


  b.disabled=true;
  b.textContent=
    "マスタ更新中…";


  try{

    const r=
      await fetch(
        SYNC_URL+
        "?action=master&ts="+
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const j=
      await r.json();


    if(!j.ok){

      throw Error(
        j.message||
        "マスタ取得失敗"
      );

    }


    for(
      const k of KEYS
    ){

      await put(
        MASTER,
        {
          key:k,
          values:
            Array.isArray(
              j.master?.[k]
            )
            ?j.master[k]
            :[]
        }
      );

    }


    await loadMaster();


    msg(
      "✓ マスタを更新しました。"
    );


  }catch(e){

    msg(
      "マスタを更新できませんでした。\n"+
      e.message,
      false
    );

  }finally{

    b.disabled=false;

    b.textContent=
      "マスタを更新";

  }

}


/* =========================
   入力値取得
========================= */

function getFormData(){

  let quantityText=
    val("quantity");


  /*
   * iPhone対策
   *
   * 全角ピリオド
   * カンマ
   * を半角ピリオドに統一
   */

  quantityText=
    quantityText
      .replace(/,/g,".")
      .replace(/．/g,".");


  return {

    warehouse:
      val("warehouse"),

    producer:
      val("producer"),

    field:
      val("field"),

    cultivation:
      val("cultivation"),

    variety:
      val("variety"),

    size:
      val("size"),

    unit:
      val("unit"),

    quantity:
      quantityText,

    note:
      val("note")

  };

}


/* =========================
   通常登録・修正登録
========================= */

async function saveLocal(){

  const p=
    getFormData();


  /* 必須項目 */

  for(
    const [k,n]
    of [
      [
        "warehouse",
        "倉庫番号"
      ],
      [
        "producer",
        "生産者"
      ],
      [
        "field",
        "圃場"
      ],
      [
        "cultivation",
        "栽培方法"
      ],
      [
        "variety",
        "品種"
      ],
      [
        "size",
        "サイズ"
      ],
      [
        "unit",
        "単位"
      ]
    ]
  ){

    if(!p[k]){

      return msg(
        n+
        "を選択してください。",
        false
      );

    }

  }


  /* 数量 */

  if(
    p.quantity===
    ""
  ){

    return msg(
      "数量を入力してください。",
      false
    );

  }


  const numericQuantity=
    Number(
      p.quantity
    );


  if(
    !Number.isFinite(
      numericQuantity
    )||
    numericQuantity<0
  ){

    return msg(
      "数量は0以上の数字で入力してください。",
      false
    );

  }


  p.quantity=
    numericQuantity;


  /* 前回選択を保存 */

  const last={
    ...p
  };


  delete last.quantity;
  delete last.note;


  localStorage.setItem(
    "lastInput",
    JSON.stringify(last)
  );


  /*
   * =========================
   * 修正モード
   * =========================
   */

  if(
    editingId!==null
  ){

    await saveEditedRecord(
      p
    );

    return;

  }


  /*
   * =========================
   * 通常登録
   * =========================
   */

  await put(
    STORE,
    {

      localId:
        newId(),

      createdAt:
        new Date()
          .toISOString(),

      ...p,

      synced:false,

      cancelRequested:false

    }
  );


  setv(
    "quantity",
    ""
  );


  setv(
    "note",
    "");


  msg(
    "✓ 登録しました。端末内に保存しました。"
  );


  render();


  setTimeout(
    ()=>{
      document
        .getElementById(
          "quantity"
        )
        .focus();
    },
    50
  );

}


/* =========================
   修正処理
========================= */

async function saveEditedRecord(
  p
){

  const a=
    await all(STORE);


  const old=
    a.find(
      x=>
        x.id===
        editingId
    );


  if(!old){

    cancelEditMode();

    return msg(
      "修正対象の登録が見つかりませんでした。",
      false
    );

  }


  /*
   * 元の登録を
   * 取消ログへ記録
   */

  const cancelLog={

    createdAt:
      old.createdAt,

    localId:
      old.localId,

    warehouse:
      old.warehouse,

    producer:
      old.producer,

    field:
      old.field,

    cultivation:
      old.cultivation,

    variety:
      old.variety,

    size:
      old.size,

    unit:
      old.unit,

    quantity:
      old.quantity,

    note:
      old.note,

    cancelReason:
      "修正"

  };


  await put(
    CANCELS,
    {
      ...cancelLog,
      logged:false
    }
  );


  /*
   * 元データがすでに
   * Google Sheetsへ同期済みなら、
   * 後で元のデータを削除する。
   */

  if(
    old.synced
  ){

    old.cancelRequested=
      true;

    await put(
      STORE,
      old
    );

  }else{

    /*
     * まだ同期していない
     * 元データなら、
     * Google Sheetsには存在しないので
     * 端末からそのまま削除。
     */

    await del(
      STORE,
      old.id
    );

  }


  /*
   * 修正後の新しい登録を作成
   */

  await put(
    STORE,
    {

      localId:
        newId(),

      createdAt:
        new Date()
          .toISOString(),

      ...p,

      synced:false,

      cancelRequested:false

    }
  );


  /* 修正モード解除 */

  editingId=null;


  document
    .getElementById(
      "editMode"
    )
    .style.display=
      "none";


  document
    .getElementById(
      "cancelEditButton"
    )
    .style.display=
      "none";


  document
    .getElementById(
      "saveButton"
    )
    .textContent=
      "10. 登録する";


  setv(
    "quantity",
    ""
  );


  setv(
    "note",
    "");


  msg(
    "✓ 登録内容を修正しました。\n元の登録は取消ログに記録しました。"
  );


  render();


  /*
   * オンラインなら
   * すぐ同期
   */

  if(
    navigator.onLine
  ){

    await syncData();

  }


  setTimeout(
    ()=>{
      document
        .getElementById(
          "quantity"
        )
        .focus();
    },
    50
  );

}


/* =========================
   修正モード開始
========================= */

async function editRecord(
  id
){

  const a=
    await all(STORE);


  const r=
    a.find(
      x=>x.id===id
    );


  if(!r)
    return;


  if(
    !confirm(
      "この登録を修正しますか？\n\n"+
      r.warehouse+
      " / "+
      r.producer+
      " / "+
      r.field+
      "\n"+
      r.quantity+
      r.unit
    )
  ){

    return;

  }


  editingId=
    id;


  /*
   * 登録内容を
   * 入力欄へ戻す
   */

  setv(
    "warehouse",
    r.warehouse
  );

  setv(
    "producer",
    r.producer
  );

  setv(
    "field",
    r.field
  );

  setv(
    "cultivation",
    r.cultivation
  );

  setv(
    "variety",
    r.variety
  );

  setv(
    "size",
    r.size
  );

  setv(
    "unit",
    r.unit
  );


  /*
   * 数量は文字列でセット
   * iPhoneの入力欄でも
   * 小数を維持
   */

  setv(
    "quantity",
    String(
      r.quantity
    )
  );


  setv(
    "note",
    r.note
  );


  /*
   * 修正モード表示
   */

  document
    .getElementById(
      "editMode"
    )
    .style.display=
      "block";


  document
    .getElementById(
      "cancelEditButton"
    )
    .style.display=
      "block";


  document
    .getElementById(
      "saveButton"
    )
    .textContent=
      "✏️ 修正して登録";


  /*
   * 画面上部へ移動
   */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  setTimeout(
    ()=>{
      document
        .getElementById(
          "quantity"
        )
        .focus();
    },
    400
  );

}

/* =========================
   最新3件表示
========================= */

async function render(){

  const a=
    await all(STORE);


  const active=
    a.filter(
      x=>
        !x.cancelRequested
    );


  const pending=
    active.filter(
      x=>
        !x.synced
    ).length;


  document
    .getElementById(
      "count"
    )
    .textContent=
      active.length+
      "件（未同期 "+
      pending+
      "件）";


  /*
   * 最新3件
   */

  const latest=
    active
      .slice(-3)
      .reverse();


  document
    .getElementById(
      "history"
    )
    .innerHTML=

      latest
      .map(
        r=>{

          const d=
            new Date(
              r.createdAt
            );


          return `

<div class="history-row">

<div class="history-main">

${d.toLocaleString("ja-JP")}

<br>

${r.warehouse}
 /
${r.producer}
 /
${r.field}
 /
${r.cultivation}
 /
${r.variety}
 /
${r.size}
 /
${r.quantity}${r.unit}

${
  r.note
  ?" / "+r.note
  :""
}

<span class="badge ${
  r.synced
  ?"synced"
  :"pending"
}">
${
  r.synced
  ?"同期済み"
  :"未同期"
}
</span>

</div>


<div class="history-actions">

<button
  class="edit-button"
  onclick="editRecord(${r.id})"
>
✏️ この登録を修正
</button>


<button
  class="cancel-button"
  onclick="cancelRecord(${r.id})"
>
↩ この登録を取消
</button>

</div>

</div>

`;

        }
      )
      .join("");

}


/* =========================
   取消処理
========================= */

async function cancelRecord(
  id
){

  const a=
    await all(STORE);


  const r=
    a.find(
      x=>x.id===id
    );


  if(!r)
    return;


  if(
    !confirm(
      "この登録を取り消しますか？\n\n"+
      r.warehouse+
      " / "+
      r.producer+
      " / "+
      r.field+
      "\n"+
      r.quantity+
      r.unit
    )
  ){

    return;

  }


  const cancelLog={

    createdAt:
      r.createdAt,

    localId:
      r.localId,

    warehouse:
      r.warehouse,

    producer:
      r.producer,

    field:
      r.field,

    cultivation:
      r.cultivation,

    variety:
      r.variety,

    size:
      r.size,

    unit:
      r.unit,

    quantity:
      r.quantity,

    note:
      r.note,

    cancelReason:
      "入力ミス"

  };


  await put(
    CANCELS,
    {
      ...cancelLog,
      logged:false
    }
  );


  /*
   * 未同期なら
   * サーバーにまだ存在しない
   */

  if(!r.synced){

    await del(
      STORE,
      id
    );


    msg(
      "✓ 登録を取り消しました。\n取消ログは同期待ちです。"
    );


    render();


    if(
      navigator.onLine
    ){

      await syncData();

    }


    return;

  }


  /*
   * 同期済みなら
   * サーバー側削除を予約
   */

  r.cancelRequested=
    true;


  await put(
    STORE,
    r
  );


  render();


  if(
    navigator.onLine
  ){

    await syncData();

  }else{

    msg(
      "✓ 取消を予約しました。\n電波が戻ったら同期してください。"
    );

  }

}


/* =========================
   Google Sheets同期
========================= */

async function syncData(){

  if(!navigator.onLine){

    return msg(
      "現在オフラインです。電波が入ってから同期してください。",
      false
    );

  }


  if(
    SYNC_URL.startsWith("ここに")
  ){

    return msg(
      "SYNC_URLにCode.gsのWebアプリURLを設定してください。",
      false
    );

  }


  const b=
    document.getElementById(
      "syncButton"
    );


  b.disabled=true;

  b.textContent=
    "同期中…";


  try{

    const a=
      await all(STORE);


    /*
     * 新規・修正後のデータ
     */

    const rows=
      a.filter(
        r=>
          !r.synced &&
          !r.cancelRequested
      );


    /*
     * 同期済みで
     * 取消・修正されたデータ
     */

    const deletes=
      a
      .filter(
        r=>
          r.synced &&
          r.cancelRequested
      )
      .map(
        r=>r.localId
      );


    /*
     * 取消・修正ログ
     */

    const cancelLogs=
      (
        await all(CANCELS)
      )
      .filter(
        r=>!r.logged
      );


    if(
      !rows.length &&
      !deletes.length &&
      !cancelLogs.length
    ){

      msg(
        "未同期データはありません。"
      );

      return;

    }


    const r=
      await fetch(
        SYNC_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              records:
                rows,

              deleteIds:
                deletes,

              cancelLogs:
                cancelLogs

            })

        }
      );


    const j=
      await r.json();


    if(!j.ok){

      throw Error(
        j.message||
        "同期失敗"
      );

    }


    /*
     * 新規データを同期済みに
     */

    for(
      const x of rows
    ){

      x.synced=true;


      await put(
        STORE,
        x
      );

    }


    /*
     * 取消・修正された
     * 元データを端末から削除
     */

    for(
      const x of
      a.filter(
        r=>
          r.synced &&
          r.cancelRequested
      )
    ){

      await del(
        STORE,
        x.id
      );

    }


    /*
     * 取消ログを端末から削除
     * （Google Sheetsには残る）
     */

    for(
      const x of cancelLogs
    ){

      await del(
        CANCELS,
        x.id
      );

    }


    let message="";


    if(rows.length){

      message+=
        rows.length+
        "件を同期しました。";

    }


    if(deletes.length){

      message+=
        "\n取消・修正 "+
        deletes.length+
        "件を反映しました。";

    }


    if(cancelLogs.length){

      message+=
        "\n取消ログ "+
        cancelLogs.length+
        "件を記録しました。";

    }


    msg(
      message
    );


    render();


  }catch(e){

    msg(
      "同期できませんでした。\n"+
      e.message,
      false
    );

  }finally{

    b.disabled=false;

    b.textContent=
      "Googleスプレッドシートへ同期";

  }

}

========================= */

addEventListener(

  ()=>{
    syncData()
      .catch(

      );

);

);

========================= */

  "load",
  async()=>{

    status();


    await loadMaster();


    if(
      navigator.onLine &&
      !SYNC_URL.startsWith("ここに")
    ){

      await syncMaster();

    }


    await render();


    if(
      "serviceWorker"
      in navigator
    ){

      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .catch(
          ()=>{}
        );

    }

  }
);
