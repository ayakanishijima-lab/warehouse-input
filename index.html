<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="入庫入力">
<link rel="manifest" href="manifest.json">
<title>入庫・数量入力</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.header{background:#2e7d32;color:#fff;text-align:center;font-size:30px;font-weight:700;padding:18px 10px}
.container{padding:16px;max-width:720px;margin:auto}.status{font-size:20px;font-weight:700;background:#fff;border:2px solid #ccc;border-radius:12px;padding:12px 14px;margin-bottom:16px}
.online{color:#2e7d32}.offline{color:#c62828}.field{margin-bottom:20px}label{display:block;font-size:30px;font-weight:700;margin-bottom:8px}
select,input,textarea{width:100%;border:3px solid #999;border-radius:12px;background:#fff;font-size:30px;font-weight:700;padding:14px 16px;min-height:74px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#444 50%),linear-gradient(135deg,#444 50%,transparent 50%);background-position:calc(100% - 30px) 31px,calc(100% - 20px) 31px;background-size:11px 11px,11px 11px;background-repeat:no-repeat;padding-right:60px}
input[type=number]{font-size:36px;text-align:right;min-height:82px}textarea{min-height:120px;resize:vertical;font-weight:400;line-height:1.5}
.button{width:100%;border:0;border-radius:14px;background:#2e7d32;color:#fff;font-size:30px;font-weight:700;padding:20px 10px;min-height:82px}.button:disabled{background:#999}.secondary{background:#455a64;margin-top:12px}
.message{display:none;margin-top:15px;padding:14px;border-radius:12px;text-align:center;font-size:24px;font-weight:700;white-space:pre-line}.success{display:block;background:#e8f5e9;color:#2e7d32;border:3px solid #81c784}.error{display:block;background:#ffebee;color:#c62828;border:3px solid #ef9a9a}
.history{margin-top:22px;background:#fff;border-radius:12px;padding:14px;border:2px solid #ccc}.history h2{font-size:26px;margin:0 0 10px}.history-row{padding:12px 0;border-bottom:1px solid #ddd;font-size:18px;line-height:1.45}.history-row:last-child{border-bottom:0}.history-main{margin-bottom:9px}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:15px;font-weight:700;margin-left:6px}.pending{background:#fff3cd;color:#856404}.synced{background:#d4edda;color:#155724}.cancelled{background:#f8d7da;color:#721c24}
.cancel-button{border:0;border-radius:10px;background:#c62828;color:#fff;font-size:19px;font-weight:700;padding:10px 16px;min-height:48px;width:100%}.cancel-button:disabled{background:#999}
.small{font-size:16px;color:#666}
@media(max-width:400px){label{font-size:28px}select,input,textarea{font-size:28px}.header{font-size:28px}}
</style>
</head>
<body>
<div class="header">入庫・数量入力</div>
<div class="container">
<div id="status" class="status">確認中…</div>
<div class="field"><label>1. 倉庫番号</label><select id="warehouse"><option value="">選択してください</option></select></div>
<div class="field"><label>2. 生産者</label><select id="producer"><option value="">選択してください</option></select></div>
<div class="field"><label>3. 圃場</label><select id="field"><option value="">選択してください</option></select></div>
<div class="field"><label>4. 栽培方法</label><select id="cultivation"><option value="">選択してください</option></select></div>
<div class="field"><label>5. 品種</label><select id="variety"><option value="">選択してください</option></select></div>
<div class="field"><label>6. サイズ</label><select id="size"><option value="">選択してください</option></select></div>
<div class="field"><label>7. 単位</label><select id="unit"><option value="">選択してください</option></select></div>
<div class="field"><label>8. 数量</label><input id="quantity" type="text" inputmode="decimal" min="0" step="any" placeholder="数量を入力"></div>
<div class="field"><label>9. 備考</label><textarea id="note" placeholder="必要があれば入力してください"></textarea></div>
<button id="saveButton" class="button" onclick="saveLocal()">10. 登録する</button>
<button id="syncButton" class="button secondary" onclick="syncData()">Googleスプレッドシートへ同期</button>
<button id="masterButton" class="button secondary" onclick="syncMaster()">マスタを更新</button>
<div id="message" class="message"></div>
<div class="history"><h2>12. 最新の登録履歴（3件）</h2><div id="count" style="font-size:28px;font-weight:700">0件</div><div id="history"></div></div>
<div class="small" style="text-align:center;margin-top:12px">登録後も「倉庫番号～単位」はそのまま引き継ぎます。数量・備考だけ空欄になります。<br>間違えた登録は、最新履歴の「この登録を取消」で取り消せます。</div>
</div>
<script>
const DB_NAME="warehouseInputDB",DB_VERSION=2,STORE="records",MASTER="master",CANCELS="cancels";
const KEYS=["warehouse","producer","field","cultivation","variety","size","unit"];
const DEFAULT={warehouse:["倉庫1","倉庫2","倉庫3"],producer:[],field:[],cultivation:["有機","特栽","慣行"],variety:[],size:[],unit:["袋","kg"]};
// Code.gsのWebアプリURL
const SYNC_URL="https://script.google.com/macros/s/AKfycbz2n6MXTa8GIjq0GTDk0UekZlXg2Bv09xUUvyRe9cuVHxydEF0HAS10We5gSBSg3ycd/exec";

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});if(!d.objectStoreNames.contains(MASTER))d.createObjectStore(MASTER,{keyPath:"key"});if(!d.objectStoreNames.contains(CANCELS))d.createObjectStore(CANCELS,{keyPath:"id",autoIncrement:true});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function put(store,obj){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).put(obj);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function del(store,key){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,"readwrite");t.objectStore(store).delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function all(store){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function val(id){return document.getElementById(id).value.trim()}function setv(id,v){document.getElementById(id).value=v||""}
function msg(t,ok=true){const e=document.getElementById("message");e.textContent=t;e.className="message "+(ok?"success":"error");setTimeout(()=>e.className="message",3500)}
function status(){const e=document.getElementById("status");e.className="status "+(navigator.onLine?"online":"offline");e.textContent=navigator.onLine?"🟢 オンライン":"🔴 オフライン（端末内に保存します）"}
function fill(id,a){const s=document.getElementById(id);s.innerHTML='<option value="">選択してください</option>';[...new Set(a||[])].filter(Boolean).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)})}
function newId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}
async function loadMaster(){let a=await all(MASTER);if(!a.length){for(const k of KEYS)await put(MASTER,{key:k,values:DEFAULT[k]||[]});a=await all(MASTER)}const m=Object.fromEntries(a.map(x=>[x.key,x.values]));KEYS.forEach(k=>fill(k,m[k]));const last=JSON.parse(localStorage.getItem("lastInput")||"{}");KEYS.forEach(k=>setv(k,last[k]))}
async function syncMaster(){
 if(!navigator.onLine)return msg("現在オフラインです。電波が入ってからマスタを更新してください。",false);
 if(SYNC_URL.startsWith("ここに"))return msg("SYNC_URLにCode.gsのWebアプリURLを設定してください。",false);
 const b=document.getElementById("masterButton");b.disabled=true;b.textContent="マスタ更新中…";
 try{const r=await fetch(SYNC_URL+"?action=master&ts="+Date.now(),{method:"GET",cache:"no-store"});const j=await r.json();if(!j.ok)throw Error(j.message||"マスタ取得失敗");for(const k of KEYS)await put(MASTER,{key:k,values:Array.isArray(j.master?.[k])?j.master[k]:[]});await loadMaster();msg("✓ マスタを更新しました。")}catch(e){msg("マスタを更新できませんでした。\n"+e.message,false)}finally{b.disabled=false;b.textContent="マスタを更新"}
}
async function saveLocal(){
 const p={warehouse:val("warehouse"),producer:val("producer"),field:val("field"),cultivation:val("cultivation"),variety:val("variety"),size:val("size"),unit:val("unit"),quantity:val("quantity"),note:val("note")};
 for(const [k,n] of [["warehouse","倉庫番号"],["producer","生産者"],["field","圃場"],["cultivation","栽培方法"],["variety","品種"],["size","サイズ"],["unit","単位"]])if(!p[k])return msg(n+"を選択してください。",false);
 if(p.quantity==="")return msg("数量を入力してください。",false);if(!Number.isFinite(Number(p.quantity))||Number(p.quantity)<0)return msg("数量は0以上の数字で入力してください。",false);
 const last={...p};delete last.quantity;delete last.note;localStorage.setItem("lastInput",JSON.stringify(last));
 await put(STORE,{localId:newId(),createdAt:new Date().toISOString(),...p,synced:false,cancelRequested:false});
 setv("quantity","");setv("note","");msg("✓ 登録しました。端末内に保存しました。");render();setTimeout(()=>document.getElementById("quantity").focus(),50)
}
async function render(){
 const a=await all(STORE);const active=a.filter(x=>!x.cancelRequested);const pending=active.filter(x=>!x.synced).length;document.getElementById("count").textContent=active.length+"件（未同期 "+pending+"件）";
 const latest=a.filter(x=>!x.cancelRequested).slice(-3).reverse();
 document.getElementById("history").innerHTML=latest.map(r=>{const d=new Date(r.createdAt);return `<div class="history-row"><div class="history-main">${d.toLocaleString("ja-JP")}<br>${r.warehouse} / ${r.producer} / ${r.field} / ${r.cultivation} / ${r.variety} / ${r.size} / ${r.quantity}${r.unit}${r.note?" / "+r.note:""} <span class="badge ${r.synced?"synced":"pending"}">${r.synced?"同期済み":"未同期"}</span></div><button class="cancel-button" onclick="cancelRecord(${r.id})">↩ この登録を取消</button></div>`}).join("");
}
async function cancelRecord(id){
 const a=await all(STORE);const r=a.find(x=>x.id===id);if(!r)return;
 if(!confirm("この登録を取り消しますか？\n\n"+r.warehouse+" / "+r.producer+" / "+r.field+"\n"+r.quantity+r.unit))return;
 const cancelLog={createdAt:r.createdAt,localId:r.localId,warehouse:r.warehouse,producer:r.producer,field:r.field,cultivation:r.cultivation,variety:r.variety,size:r.size,unit:r.unit,quantity:r.quantity,note:r.note,cancelReason:"入力ミス"};
 await put(CANCELS,{...cancelLog,logged:false});
 if(!r.synced){await del(STORE,id);msg("✓ 登録を取り消しました。取消ログは同期待ちです。");render();if(navigator.onLine)await syncData();return}
 r.cancelRequested=true;await put(STORE,r);render();
 if(navigator.onLine){await syncData();}else{msg("✓ 取消を予約しました。電波が戻ったら同期してください。")}
}
async function syncData(){
 if(!navigator.onLine)return msg("現在オフラインです。電波が入ってから同期してください。",false);
 if(SYNC_URL.startsWith("ここに"))return msg("SYNC_URLにCode.gsのWebアプリURLを設定してください。",false);
 const b=document.getElementById("syncButton");b.disabled=true;b.textContent="同期中…";
 try{
  const a=await all(STORE);const rows=a.filter(r=>!r.synced&&!r.cancelRequested);const deletes=a.filter(r=>r.synced&&r.cancelRequested).map(r=>r.localId);
  const cancelLogs=(await all(CANCELS)).filter(r=>!r.logged);
  if(!rows.length&&!deletes.length&&!cancelLogs.length){msg("未同期データはありません。");return}
  const r=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({records:rows,deleteIds:deletes,cancelLogs:cancelLogs})});const j=await r.json();if(!j.ok)throw Error(j.message||"同期失敗");
  for(const x of rows){x.synced=true;await put(STORE,x)}for(const x of a.filter(r=>r.synced&&r.cancelRequested))await del(STORE,x.id);for(const x of cancelLogs)await del(CANCELS,x.id);
  msg((rows.length?rows.length+"件を同期しました。":"")+(deletes.length?"\n取消 "+deletes.length+"件を反映しました。":"")+(cancelLogs.length?"\n取消ログ "+cancelLogs.length+"件を記録しました。":""));render();
 }catch(e){msg("同期できませんでした。\n"+e.message,false)}finally{b.disabled=false;b.textContent="Googleスプレッドシートへ同期"}
}
addEventListener("online",status);addEventListener("online",()=>{syncData().catch(()=>{})});addEventListener("offline",status);
addEventListener("load",async()=>{status();await loadMaster();if(navigator.onLine&&!SYNC_URL.startsWith("ここに"))await syncMaster();await render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
